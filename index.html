<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>세계지리 학습 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
    * {
        box-sizing:border-box
    }

    body {
        margin: 0;
        font-family: system-ui, 'Noto Sans KR', sans-serif;
        color: #172b42
    }

    #map {
        height: 100vh;
        width: 100%;
        background: #dcebf5
    }

    #panel {
        position: absolute;
        right: 14px;
        top: 66px;
        bottom: 15px;
        width: 340px;
        overflow: auto;
        background: #fff;
        z-index: 1100;
        border-radius: 14px;
        box-shadow: 0 4px 20px #1d354a33;
        padding: 18px
    }

    #toolbar {
        position: absolute;
        z-index: 1100;
        top: 15px;
        right: 14px;
        display: flex;
        align-items: center;
        gap: 9px;
        background: #fff;
        padding: 10px 13px;
        border-radius: 10px;
        box-shadow: 0 2px 12px #1d354a29
    }

    #theme {
        padding: 7px;
        border: 1px solid #bccddd;
        border-radius: 6px;
        background: white
    }

    .legend {
        background: white;
        padding: 12px 14px;
        border-radius: 10px;
        box-shadow: 0 2px 12px #1d354a29;
        line-height: 1.7;
        min-width: 174px;
        font-size: 12px
    }

    .legend strong {
        display: block;
        font-size: 13px;
        margin-bottom: 6px
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 7px
    }

    .swatch {
        height: 12px;
        width: 17px;
        display: inline-block;
        border: 1px solid #9daebe;
        border-radius: 2px;
        flex-shrink: 0
    }

    .muted {
        color: #67788a;
        font-size:12px
    }

    .section {
        border-top: 1px solid #e5ebf0;
        padding-top: 12px;
        margin-top: 14px
    }

    .section h3 {
        margin: 0 0 8px;
        font-size:15px
    }

    h2 {
        font-size: 22px;
        margin: 10px 0
    }

    .fact {
        margin: 7px 0;
        font-size:14px
    }

    .fact b {
        color: #3b556c
    }

    .bar {
        height: 12px;
        display: flex;
        overflow: hidden;
        border-radius: 9px;
        margin: 9px 0 5px;
        background: #e9edf0
    }

    .bar > span {
        height:100%
    }

    .age-row {
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        margin: 4px 0
    }

    .loading {
        font-size: 12px;
        color:#5a7083
    }

    .flag {
        width: 96px;
        box-shadow: 0 1px 7px #0002;
        border: 1px solid #ddd
    }

    .error {
        color:#ad342d
    }

    a {
        color: #155d96
    }

    @media (max-width: 650px) {
        #panel {
            top: auto;
            bottom: 0;
            right: 0;
            left: 0;
            width: 100%;
            height: 39vh;
            border-radius:16px 16px 0 0
        }

        #toolbar {
            top: 10px;
            right:10px
        }

        .legend {
            padding: 8px 10px;
            font-size: 11px
        }
    }
    </style>
</head>

        return typeof n === 'number' && Number.isFinite(n) ? pctFmt.format(n) + '%' : '자료 없음'
    }

        return String(s ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'

    // 좌표를 경도 ±180°에서 잘라 러시아·피지 등 날짜변경선 교차 도형을 올바르게 표시.
    function clipRing(ring, minX, maxX) {
        const clip = (pts, bound, isMin) => {
            if (!pts.length)
                return [];
            const inside = p => isMin ? p[0] >= bound : p[0] <= bound;
            const cross = (a, b) => {
                const t = (bound - a[0]) / (b[0] - a[0]);
                return [bound, a[1] + t * (b[1] - a[1])]
            };
            const result = [];
            let prev = pts[pts.length - 1];
            for (const cur of pts) {
                const p = inside(prev),
                    c = inside(cur);
                if (c) {
                    if (!p)
                        result.push(cross(prev, cur));
                    result.push(cur)
                } else if (p)
                    result.push(cross(prev, cur));
                prev = cur
            }
            return result
        };
        let pts = ring.slice();
        if (pts.length > 1 && pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1])
            pts.pop();
        pts = clip(clip(pts, minX, true), maxX, false);
        if (pts.length < 3)
            return null;
        pts.push([...pts[0]]);
        return pts;
    }
    function unwrap(ring) {
        if (!ring.length)
            return [];
        let prev = ring[0][0];
        return ring.map((p, i) => {
            let x = p[0];
            if (i) {
                while (x - prev > 180)
                    x -= 360;
                while (x - prev < -180)
                    x += 360
            }
            prev = x;
            return [x, p[1]]
        })
    }
    function splitPolygon(rings) {
        if (!rings.length)
            return [];
        const shell = unwrap(rings[0]);
        if (!shell.length)
            return [];
        const min = Math.min(...shell.map(p => p[0])),
            max = Math.max(...shell.map(p => p[0]));
        const out = [];
        for (let k = Math.floor((min + 180) / 360) - 1; k <= Math.floor((max + 180) / 360) + 1; k++) {
            const left = -180 + 360 * k,
                right = 180 + 360 * k;
            const clipped = clipRing(shell, left, right);
            if (!clipped)
                continue;
            const part = [clipped.map(p => [p[0] - 360 * k, p[1]])];
            for (const hole of rings.slice(1)) {
                let h = unwrap(hole);
                if (!h.length)
                    continue;
                const mid = (Math.min(...shell.map(p => p[0])) + Math.max(...shell.map(p => p[0]))) / 2;
                const avg = h.reduce((s, p) => s + p[0], 0) / h.length;
                const shift = 360 * Math.round((mid - avg) / 360);
                h = h.map(p => [p[0] + shift, p[1]]);
                const clippedHole = clipRing(h, left, right);
                if (clippedHole)
                    part.push(clippedHole.map(p => [p[0] - 360 * k, p[1]]));
            }
            out.push(part);
        }
        return out;
    }
    function fixDateline(feature) {
        const g = feature.geometry;
        if (!g || !['Polygon', 'MultiPolygon'].includes(g.type))
            return feature;
        const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
        const parts = polys.flatMap(splitPolygon);
        return {
            ...feature,
            geometry: {
                type: 'MultiPolygon',
                coordinates: parts
            }
        };
    }
    function draw() {
        if (!geo)
            return;
        const theme = themeSelect.value;
        if (layer)
            map.removeLayer(layer);
        layer = L.geoJSON(geo, {
            style: f => ({
                fillColor: breakColor(val(theme, f.id), theme),
                weight: selectedId === String(f.id) ? 2.5 : 0.65,
                color: selectedId === String(f.id) ? '#ffc94f' : '#fff',
                fillOpacity: .87
            }),
            onEachFeature: (f, l) => {
                l.on('click', () => {
                    selectedId = String(f.id);
                    showInfo(selectedId);
                    draw()
                });
                l.bindTooltip(nameKR(countries[String(f.id).padStart(3, '0')]), {
                    sticky: true
                })
            }
        }).addTo(map);
        updateLegend()
    }
    async function fetchJSON(url) {
        const r = await fetch(url);
        if (!r.ok)
            throw Error('HTTP ' + r.status + ' ' + url);
        return r.json()
    }
    async function fetchWB(key, indicator, iso3num) {
        try {
            const raw = await fetchJSON(`https://api.worldbank.org/v2/country/all/indicator/${indicator}?format=json&mrv=5&per_page=20000`);
            if (!Array.isArray(raw) || !Array.isArray(raw[1]))
                throw Error('응답 형식 오류');
            for (const r of raw[1]) {
                const id = iso3num[r.countryiso3code];
                if (!id || r.value === null || stat[key][id] !== undefined)
                    continue;
                stat[key][id] = Number(r.value);
                year[key][id] = r.date
            }
        } catch (err) {
            console.warn(key + ' 데이터를 불러오지 못했습니다.', err)
        }
    }
    async function load() {
        try {
            const topo = await fetchJSON('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
            geo = {
                type: 'FeatureCollection',
                features: topojson.feature(topo, topo.objects.countries).features.map(f => fixDateline({
                    ...f,
                    id: String(f.id).padStart(3, '0')
                }))
            };
            draw();
            const rc = await fetchJSON('https://cdn.jsdelivr.net/gh/mledoze/countries@master/countries.json');
            rc.forEach(c => {
                if (c.ccn3) {
                    countries[c.ccn3] = c;
                    allCountries.push(c)
                }
            });
            const iso3num = Object.fromEntries(allCountries.filter(c => c.cca3 && c.ccn3).map(c => [c.cca3, c.ccn3]));
            // 최신 비결측 연도 선택. 지표에 따라 연도가 서로 다를 수 있음.
            await Promise.all([
            fetchWB('population', 'SP.POP.TOTL', iso3num), fetchWB('gdp', 'NY.GDP.MKTP.CD', iso3num),
            fetchWB('age0', 'SP.POP.0014.TO.ZS', iso3num), fetchWB('age15', 'SP.POP.1564.TO.ZS', iso3num), fetchWB('age65', 'SP.POP.65UP.TO.ZS', iso3num),
            fetchWB('male', 'SP.POP.TOTL.MA.IN', iso3num), fetchWB('female', 'SP.POP.TOTL.FE.IN', iso3num)
            ]);
            draw();
            panel.innerHTML = '<h2>세계지리 학습 지도</h2><p>지도에서 국가를 클릭하면 국가별 정보를 확인할 수 있습니다.</p><p class="muted">지도의 색은 왼쪽 아래 범례를 확인하세요. 자료가 없는 국가는 회색으로 표시됩니다.</p>';
        } catch (err) {
            console.error(err);
            panel.innerHTML = `<h2 class="error">데이터 로딩 오류</h2><p>인터넷 연결이나 외부 데이터 제공 상태를 확인해 주세요.</p><p class="muted">${safe(err.message)}</p>`
        }
    }
    function showInfo(id) {
        const c = countries[String(id).padStart(3, '0')];
        if (!c) {
            panel.innerHTML = '<h2>국가 정보 없음</h2><p>해당 지역의 상세 정보가 준비되지 않았습니다.</p>';
            return
        }
        const iso = c.cca2,
            overviewData = overview[iso];
        const ages = ['age0', 'age15', 'age65'].map(k => val(k, id));
        const female = val('female', id),
            male = val('male', id);
        const sexRatio = male != null && female > 0 ? male / female * 100 : null;
        const ageNames = ['유소년층 (0~14세)', '생산가능연령층 (15~64세)', '고령층 (65세 이상)'];
        const values = ages.map(v => typeof v === 'number' ? Math.min(100, Math.max(0, v)) : 0);
        const yr = k => year[k][String(id).padStart(3, '0')] || '연도 미상';
        const languages = Object.keys(c.languages || {}).map(k => langNames[k]).filter(Boolean);
        const capital = capitals[iso] || '한국어 수도명 미등록';
        panel.innerHTML = `
         ${iso && /^[A-Z]{2}$/.test(iso) ? `<img class="flag" alt="${safe(nameKR(c))} 국기" src="https://flagcdn.com/w160/${iso.toLowerCase()}.png">` : ''}
         <h2>${safe(nameKR(c))}</h2>
         <p class="fact"><b>수도</b> ${safe(capital)}</p>
         <p class="fact"><b>지역</b> ${safe(regionNames[c.region] || '정보 없음')}${c.subregion ? ' / ' + safe(regionNames[c.subregion] || '세부 지역명 준비 중') : ''}</p>
         <p class="fact"><b>주요 언어</b> ${languages.length ? safe(languages.join(', ')) : '한국어 언어명 미등록'}</p>
         <div class="section"><h3>인구와 경제</h3>
         <p class="fact"><b>인구</b> ${fmt(val('population', id))}명 <span class="muted">(${safe(yr('population'))}년)</span></p>
         <p class="fact"><b>명목 GDP</b> ${val('gdp', id) != null ? '약 ' + fmt(val('gdp', id) / 1e8) + '억 달러' : '자료 없음'} <span class="muted">(${safe(yr('gdp'))}년)</span></p></div>
         <div class="section"><h3>인구 구조</h3>
         ${ages.every(v => typeof v === 'number') ? `<div class="bar"><span style="width:${values[0]}%;background:#5bafd0"></span><span style="width:${values[1]}%;background:#6bad80"></span><span style="width:${values[2]}%;background:#eeac5e"></span></div>` : ''}
         ${ages.map((v, i) => `<div class="age-row"><span>${ageNames[i]}</span><strong>${percent(v)} ${v != null ? `(${safe(yr(['age0', 'age15', 'age65'][i]))}년)` : ''}</strong></div>`).join('')}
         <p class="fact"><b>성비</b> ${sexRatio == null ? '자료 없음' : `여성 100명당 남성 ${pctFmt.format(sexRatio)}명`}</p>
         <p class="muted">성비 기준: 전체 인구, ${safe(yr('male'))}년 남성 인구·${safe(yr('female'))}년 여성 인구. 연령대 비중의 합계는 반올림으로 100%와 다를 수 있습니다.</p></div>
         <div class="section"><h3>종교와 기후 (학습용 개관)</h3>
         <p class="fact"><b>대표적 종교·종교 전통</b> ${safe(overviewData?.[0] || '국가별 검증 자료 준비 중')}</p>
         <p class="fact"><b>대표적 기후</b> ${safe(overviewData?.[1] || '국가별 검증 자료 준비 중')}</p>
         <p class="muted">대표 국가의 개략적 특성으로, 종교별 비중·국가 전체의 단일 기후를 뜻하지 않습니다. 여러 종교와 기후가 함께 분포할 수 있습니다.</p>
         <p class="muted"><a href="https://ourworldindata.org/grapher/most-common-religion" target="_blank" rel="noopener">종교 분포 원자료 (Pew/OWID, 2020)</a></p></div>
         <div class="section muted">통계 출처: World Bank Open Data. 국가 기본정보: mledoze/countries. 국경: World Atlas. 주제별 데이터 기준연도가 서로 다를 수 있습니다.</div>`;
    }
    themeSelect.addEventListener('change', draw);
    load();
    </script>
</body>
</html>
